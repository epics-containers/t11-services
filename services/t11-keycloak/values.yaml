# Ported from dev-environment/daq-services `keycloak`.
#
# This is a hand-rolled chart rather than a third-party one (codecentric,
# bitnami). Reasons, specific to a standalone sim:
#  - no external chart repository to reach at deploy time
#  - compose runs `start-dev`, whose H2 database lives on the container
#    filesystem; the community
#    charts are built around a real external database and a production
#    hostname/TLS setup, which is far more to configure and to get wrong
#  - the realm bootstrap (users, clients, mappers) is the actual substance
#    here, and it is a straight lift of the compose `startup.sh`
#
# NOT FOR PRODUCTION: start-dev with an H2 database. The database is on a PVC
# (persistence, below), so users, clients, anything added in the admin console
# and the realm signing keys survive a restart. A postStart hook runs the
# bootstrap script on every container start, which creates the realm on a new
# volume and skips what already exists.
# Real beamlines use identity.diamond.ac.uk.

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.4"
  pullPolicy: IfNotPresent

# LoadBalancer so that the admin console is reachable from a workstation, at
# http://<external IP>:8080/admin. scripts/urls.sh in t11-deployment prints
# the address.
service:
  type: LoadBalancer
  port: 8080

# Admin credentials for the sim. Dev values on purpose -- see the Secret note
# in t11-rabbitmq/templates/secret.yaml.
admin:
  username: admin
  password: admin

# The issuer URL keycloak stamps into tokens. It must be resolvable by every
# consumer. Empty, keycloak (start-dev) takes the hostname from each request:
# the in-cluster clients all call http://t11-keycloak:8080, so their tokens
# carry that issuer, and a browser at the external IP gets working admin
# console URLs. A browser still cannot complete the blueapi or tiled login
# flows, which redirect to t11-keycloak:8080 -- see README. Set a URL here
# (e.g. an ingress hostname) to pin the issuer for every caller.
hostname: ""

realm: master

# Client ids follow the compose stack (`<prefix>-blueapi`), not the DLS central
# convention (`<instrument>Blueapi`), because the client JSON and secrets are
# lifted from compose.
clientPrefix: t11

# hardcoded `beamline` claim on the tiled-writer service account. Must match
# the beamline key in t11-opa's data and dodal's `BL` for the t11 module.
beamlineClaim: t11

# Redirect URIs. In-cluster service DNS by default; override with ingress
# hostnames if you expose these outside the namespace.
redirect:
  blueapi: http://t11-blueapi-oauth2
  tiled: http://t11-tiled:8000

# Demo users created in the realm, as `username:password`.
users:
  - alice:alice
  - bob:bob

# the H2 database and transaction logs, mounted at /opt/keycloak/data. With
# enabled: false they are on the container filesystem and every restart
# starts from an empty realm with new signing keys; tiled then rejects tokens
# for up to an hour, until its key cache expires
persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi
