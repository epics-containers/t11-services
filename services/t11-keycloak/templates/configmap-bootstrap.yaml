apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bootstrap
data:
  # Replaces dev-environment/daq-services/services/keycloak_config/startup.sh.
  # As in compose, it runs inside the keycloak container, from the postStart
  # hook in deployment.yaml, on every container start. Changes for Kubernetes:
  #  - wait for /health/ready before the first kcadm.sh call, so that the
  #    retry loop does not start JVMs while keycloak itself is starting
  #  - the admin credentials come from the KC_BOOTSTRAP_ADMIN_* variables
  #  - the users and clients are one partial import, realm.json, rendered
  #    from values by _realm.tpl. Each kcadm.sh call starts a JVM, and one
  #    call per user and client made the bootstrap take about 2 minutes
  #  - compose deleted the "Allowed Protocol Mapper Types" and "Allowed Client
  #    Scopes" client registration policies so that kcreg.sh could create
  #    clients with mappers. The admin API ignores those policies, so they stay
  startup.sh: |
    #!/bin/bash
    export PATH=$PATH:/opt/keycloak/bin

    # the image has no curl, so ask the management port with bash's /dev/tcp.
    # Give up after 10 minutes: a failed postStart hook restarts the container
    for ((i = 0; i < 200; i++)); do
        # the braces keep 2>/dev/null from applying to the rest of the script
        if { exec 3<>/dev/tcp/localhost/9000; } 2>/dev/null; then
            printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
            if grep -q '"UP"' <&3; then
                exec 3>&-
                break
            fi
            exec 3>&-
        fi
        sleep 3
    done
    if ((i == 200)); then
        echo "keycloak was not ready after 10 minutes"
        exit 1
    fi

    export KC_CLI_PASSWORD="${KC_BOOTSTRAP_ADMIN_PASSWORD}"
    REALM={{ .Values.realm | quote }}

    until kcadm.sh config credentials --server http://localhost:8080 \
        --realm "$REALM" --user "${KC_BOOTSTRAP_ADMIN_USERNAME}"; do sleep 3; done

    # ifResourceExists=SKIP leaves existing users and clients alone, so a
    # second run changes nothing. A failure fails the hook, which restarts
    # the container to try again
    kcadm.sh create partialImport -r "$REALM" -f /tmp/config/realm.json -o || exit 1

    echo "bootstrap complete"

  realm.json: |
    {{- include "t11-keycloak.realm" . | nindent 4 }}
