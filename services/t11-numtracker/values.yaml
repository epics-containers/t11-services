# Ported from dev-environment/daq-services `numtracker`.
#
# Fully self-contained: the chart creates its own PVC and numtracker keeps its
# state in a sqlite file on it. The only outward reference is the OPA instance,
# which is in this namespace.
#
# NOTE the double nesting: everything below `numtracker:` goes to the subchart,
# and the subchart has its own `numtracker:` block for db/storage/auth. Values
# put at the wrong level are silently ignored -- in particular auth would fall
# back to disabled.

numtracker:
  image:
    tag: "1.1.0"

  # the numtracker image is built for amd64 only
  nodeSelector:
    kubernetes.io/arch: amd64

  service:
    type: ClusterIP
    # compose served on 8406
    port: 8406

  # idle numtracker uses about 1m CPU. Requests stay at 1/10 of limits, the
  # largest ratio a DLS namespace LimitRange allows
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

  numtracker:
    db:
      fileName: numtracker.db
    storage:
      claimName: t11-numtracker-db-volume
      mount: /data
      size: 5M

    # exactly the compose NUMTRACKER_AUTH_* values, repointed at in-cluster OPA
    auth:
      enabled: true
      host: http://t11-opa:8181/
      access: v1/data/diamond/policy/numtracker/write_to_beamline_visit
      admin: v1/data/diamond/policy/admin/configure_beamline

    tracing:
      enabled: false
    graylog:
      enabled: false

# the instrument that the configure Job (templates/job-configure.yaml) sets up
# in numtracker. It must match blueapi's instrument metadata. The templates are
# those of blueapi's system tests; the directory is inside the detector IOC
configure:
  image: docker.io/library/python:3.13-alpine
  instrument: t11
  directory: /tmp/
  scan: "{instrument}-{scan_number}"
  detector: "{instrument}-{scan_number}-{detector}"
  tokenUrl: http://t11-keycloak:8080/realms/master/protocol/openid-connect/token
  numtrackerUrl: http://t11-numtracker:8406/graphql
