# Ported from dev-environment/daq-services `tiled`.
#
# Every URL compose pointed at localhost now points at an in-cluster service:
# nothing here references tiled.diamond.ac.uk, identity.diamond.ac.uk or
# authz.diamond.ac.uk.
#
# Two deliberate differences from compose:
#  - the stock ghcr.io/bluesky/tiled image is used, not the bespoke
#    ghcr.io/zohebshaikh/diamond-tiled. The DLS OPA access policy that image
#    bakes in is instead mounted from templates/configmap-access-policy.yaml,
#    which is p46-services' proven arrangement.
#  - compose's `tiled-postgres` service is not ported. The config below keeps
#    the auth database, catalog and writable storage in in-memory sqlite, so
#    a database server would never be used, and its PVC would slow a fresh
#    deploy. Everything tiled holds is lost when its pod restarts.

tiled:
  fullnameOverride: t11-tiled
  image:
    tag: 0.2.18

  service:
    type: ClusterIP
    port: 8000

  # the chart sets no resources, so the namespace LimitRange default (1 CPU at
  # DLS) would apply and count against the namespace CPU quota
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # tiled takes about 20s to start on a quiet node, and it waits for keycloak
  # before it serves (see templates/configmap-wait-oidc.yaml), which takes
  # minutes on a fresh deploy. The chart's liveness probe has no initial delay
  # and would restart it after about 30s, into a crash loop with minutes of
  # back-off. Probe liveness only after 10 minutes; the readiness probe still
  # reports tiled as soon as it serves
  livenessProbe:
    initialDelaySeconds: 600

  extraEnvVars:
    - name: PYTHONPATH
      value: /deploy/
    - name: TILED_SINGLE_USER_API_KEY
      value: SECRET

  # this list replaces the chart's default, which is only the config mount, so
  # repeat it. Without it tiled runs the image's built-in config: no
  # authentication providers, so every token gets 401
  volumeMounts:
    - name: config
      mountPath: /deploy/config
      readOnly: true
    - name: access-policy
      mountPath: /deploy/access_policy
      readOnly: true
  volumes:
    # the access_policy package: the OPA policy (dls.py) and the authenticator
    # that waits for keycloak (wait_oidc.py)
    - name: access-policy
      projected:
        sources:
          - configMap:
              name: t11-tiled-access-policy
          - configMap:
              name: t11-tiled-wait-oidc

  # rendered into the subchart's own ConfigMap as /deploy/config/config.yaml
  config:
      database:
        uri: "sqlite:///file:auth.db?mode=memory&cache=shared&uri=true"
        init_if_not_exists: true
      authentication:
        secret_keys:
          - SECRET
        providers:
        - provider: keycloak_oidc
          # tiled.authenticators:ProxiedOIDCAuthenticator, waiting for keycloak
          authenticator: access_policy.wait_oidc:WaitingProxiedOIDCAuthenticator
          args:
            audience: account
            client_id: tiled
            client_secret: tiled-secret
            device_flow_client_id: tiled-cli
            well_known_uri: "http://t11-keycloak:8080/realms/master/.well-known/openid-configuration"
            confirmation_message: "You have logged in to the t11 sim as {id}."
            redirect_on_success: "http://t11-tiled:8000/ui/auth-callback"
            user_id_claim: fedid
            scopes_map:
              read: ["read:metadata", "read:data"]
              write: ["write:metadata", "write:data","create:node","register"]
      trees:
        - path: /
          tree: catalog
          args:
            # uri: "postgresql+asyncpg://postgres:${POSTGRESQL_PASSWORD}@tiled-staging-postgres:5432/tiled_db"
            # writable_storage: "postgresql://postgres:${POSTGRESQL_PASSWORD}@tiled-staging-postgres:5432/data"
            uri:  "sqlite:///file:catalog.db?mode=memory&cache=shared&uri=true"
            writable_storage: "sqlite:///file:data.db?mode=memory&cache=shared&uri=true"
            init_if_not_exists: true
      access_control:
        access_policy: "access_policy.dls:DiamondOpenPolicyAgentAuthorizationPolicy"
        args:
          authorization_provider: "http://t11-opa:8181/v1/data/diamond/policy/"
          token_audience: account
          empty_access_blob_public: true

