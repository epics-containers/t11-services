# yaml-language-server: $schema=../.helm-shared/values.schema.json

# shared values for all services

global:
  domain: t11
  location: bl11t
  enabled: true

# shared settings for all IOC types
shared: &shared
  # hostNetwork
  # set to true for Channel Access to work outside of the cluster (or use a gateway)
  hostNetwork: false

  # running as ixxdetector account uid,gid gives access to /dls/ixx/data
  securityContext:
    allowPrivilegeEscalation: false
    # k8s-t11-beamline
    runAsUser: 36261
    runAsGroup: 36261

  # affinity chooses which servers to run on
  # Accelerator must set this for CIAs, Beamlines don't need it
  affinity: {}
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #           - key: location
    #             operator: In
    #             values:
    #               - sr03c

  # tolerations allow us to run on a tainted server
  # Accelerator must set this for CIAs, Beamlines don't need it
  tolerations: []
    # - key: location
    #   operator: Equal
    #   value: sr03c
    #   effect: NoSchedule

  # several IOC images are built for amd64 only. Every DLS node is amd64,
  # so this only matters on clusters with other node architectures
  nodeSelector:
    kubernetes.io/arch: amd64

  # an idle IOC uses a few millicores. The ioc-instance default limit of 500m
  # per IOC adds up against a namespace CPU quota, such as the 10 CPU limit of
  # a DLS personal namespace. IOCs that need more override this, e.g. di-cam
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 64Mi

# shared settings for all ibek IOCs using the ioc-instance helm chart
ioc-instance:
  <<: *shared

# shared setting for all legacy IOCs using the dev-c7 helm chart
dev-c7:
  <<: *shared
