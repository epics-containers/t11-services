# Dev credentials for the standalone sim. This is NOT a SealedSecret: the sim
# is self-contained by design and must deploy without a sealed-secrets
# controller or a manual sealing step. Do not copy this pattern to a real
# beamline -- use the SealedSecret from services-template-helm there.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
type: Opaque
stringData:
  rabbitmq-erlang-cookie: t11-sim-erlang-cookie
