# Ported from dev-environment/daq-services `rabbitmq`.
#
# Divergences from the DLS beamline template, deliberate for a standalone sim:
#  - ClusterIP, not LoadBalancer. Nothing outside the namespace needs the
#    broker, and a LoadBalancer would need an allocated IP from the site pool.
#  - a plain Secret with a dev erlang cookie, not a SealedSecret. A SealedSecret
#    depends on the cluster's sealed-secrets controller and a manual sealing
#    step, which is exactly the external dependency this repo avoids.

rabbitmq:
  # pin the service name so blueapi can address it as `t11-rabbitmq:61613`
  fullnameOverride: t11-rabbitmq

  customConfig: |-
    stomp.default_user = guest
    stomp.default_pass = guest
    log.console = true
    log.console.level = info
    log.console.use_colors = off

  authentication:
    user:
      value: guest
    password:
      value: guest
    existingSecret: rabbitmq-secrets
    erlangCookie:
      secretKey: rabbitmq-erlang-cookie

  # compose mounted these via ./services/rabbitmq_plugins; the chart enables
  # management and prometheus itself, so only the extras are listed here
  plugins:
    - rabbitmq_jms_topic_exchange
    - rabbitmq_stomp
    - rabbitmq_mqtt

  rbac:
    create: false
  serviceAccount:
    create: false

  service:
    type: ClusterIP
    extraPorts:
      - name: stomp
        port: 61613
        targetPort: stomp
        containerPort: 61613

  # sized for a sim that carries a handful of messages. The chart derives
  # RabbitMQ's memory high watermark (60%) from limits.memory, and RabbitMQ
  # uses about 300Mi after boot, so 512Mi would raise the memory alarm. With
  # 500m CPU the startup probe's rabbitmq-diagnostics timed out after 5s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 50Mi
    limits:
      cpu: 1000m
      memory: 1Gi
      ephemeral-storage: 2Gi

  # without this the init container takes the namespace LimitRange default
  # (1 CPU at DLS), and quota counts the larger of init and main container
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
