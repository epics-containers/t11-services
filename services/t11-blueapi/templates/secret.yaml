# Dev credentials for the standalone sim -- see t11-rabbitmq/templates/secret.yaml.
# These values must match the client secrets created by t11-keycloak's
# bootstrap Job.
apiVersion: v1
kind: Secret
metadata:
  name: blueapi-secret
type: Opaque
stringData:
  client-secret: {{ .Values.secrets.clientSecret | quote }}
  cookie-secret: {{ .Values.secrets.cookieSecret | quote }}
  tiled-writer-secret: {{ .Values.secrets.tiledWriterSecret | quote }}
