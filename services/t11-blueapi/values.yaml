# blueapi for the standalone t11 sim.
#
# Compose does not run blueapi itself (only its oauth2-proxy); this is the
# services-template-helm blueapi service with every central URL repointed at
# the in-cluster equivalent:
#
#   identity.diamond.ac.uk         -> t11-keycloak
#   numtracker-staging.diamond...  -> t11-numtracker
#   tiled.diamond.ac.uk            -> t11-tiled
#   <instrument>-rabbitmq-daq...   -> t11-rabbitmq
#
# Devices come from `dodal.beamlines.t11`, which is not in a dodal release
# yet. The worker installs dodal from the `t11` branch (scratch, below) until
# it is; dodal/t11.py in this repo is the reference copy of that module.

blueapi:
  # the blueapi image is built for amd64 only
  nodeSelector:
    kubernetes.io/arch: amd64

  # oauth2-proxy in front, so blueapi itself is not exposed
  ingress:
    enabled: false

  # the chart default of 2 CPU / 4000Mi suits a VS Code server in the Pod. An
  # idle worker uses about 12m / 520Mi. The scratch initContainer copies these
  # (initResources is unset), and quota counts the larger of the two.
  # The venv emptyDir counts as ephemeral storage. Without a value the DLS
  # LimitRange default of 1Gi applies and the kubelet evicts the Pod; 2Gi is
  # the LimitRange maximum
  resources:
    requests:
      cpu: 100m
      memory: 600Mi
      ephemeral-storage: 200Mi
    limits:
      cpu: 1000m
      memory: 2Gi
      ephemeral-storage: 2Gi

  extraEnvVars:
    - name: BEAMLINE
      value: t11
    - name: INSTRUMENT
      value: t11
    # reach the IOCs through this repo's own gateway service
    - name: EPICS_PVA_NAME_SERVERS
      value: t11-epics-gateways:9075
    - name: EPICS_CA_NAME_SERVERS
      value: t11-epics-gateways:9064
    - name: EPICS_PVA_AUTO_ADDR_LIST
      value: "NO"
    - name: EPICS_CA_AUTO_ADDR_LIST
      value: "NO"
    - name: TILED_WRITER_SECRET
      valueFrom:
        secretKeyRef:
          name: blueapi-secret
          key: tiled-writer-secret

  worker:
    env:
      metadata:
        instrument: t11
      sources:
        - kind: deviceManager
          module: dodal.beamlines.t11
        - kind: planFunctions
          module: dodal.plans
        - kind: planFunctions
          module: dodal.plan_stubs
      events:
        broadcast_status_events: false

    stomp:
      auth:
        username: guest
        password: guest
      url: tcp://t11-rabbitmq:61613
      enabled: true

    logging:
      level: "INFO"
      graylog:
        # no central log server in a standalone sim. NOTE the rendered config
        # still shows the chart's default graylog-log-target.diamond.ac.uk URL;
        # with enabled=false nothing connects to it. The only other occurrence
        # is in the chart's `helm test` ConfigMap, which the stack never runs.
        enabled: false

    oidc:
      well_known_url: "http://t11-keycloak:8080/realms/master/.well-known/openid-configuration"
      client_id: "t11-cli-blueapi"
      client_audience: "account"
      logout_redirect_endpoint: "oauth2/sign_out"

    numtracker:
      url: http://t11-numtracker:8406/graphql

    tiled:
      enabled: true
      url: "http://t11-tiled:8000/api/v1/"
      authentication:
        client_id: "tiled-writer"
        client_secret: ${TILED_WRITER_SECRET}

    scratch:
      root: /workspaces
      repositories:
        - name: dodal
          remote_url: https://github.com/DiamondLightSource/dodal.git
          target_revision: t11

  initContainer:
    enabled: true
    persistentVolume:
      enabled: true

# Lifted from dev-environment/daq-services/services/blueapi-oauth2-proxy/,
# with the issuer and upstream pointed in-cluster.
#
# The blueapi web UI is published through this proxy's LoadBalancer, at
# http://<external IP>/docs; scripts/urls.sh in t11-deployment prints the
# address. A browser cannot resolve the in-cluster names, and the external IPs
# change when a Service is recreated, so the browser only ever talks to this
# one IP:
#  - /realms/ and /resources/ go, without a login, to an nginx sidecar in
#    front of keycloak (templates/keycloak-proxy.yaml). It calls keycloak as
#    t11-keycloak:8080, so every token's issuer is
#    http://t11-keycloak:8080/realms/master, as blueapi and this proxy
#    require. It rewrites the absolute t11-keycloak:8080 URLs in keycloak's
#    responses into relative ones, so the browser stays on this IP
#  - loginURL is relative, so the browser logs in through this IP too
#  - the t11-blueapi client accepts any redirect URI, so keycloak allows the
#    callback to this IP
oauth2:
  fullnameOverride: t11-blueapi-oauth2
  service:
    type: LoadBalancer
  extraContainers:
    - name: keycloak-proxy
      image: nginxinc/nginx-unprivileged:1.31-alpine
      ports:
        - name: keycloak-proxy
          containerPort: 8081
      # the DLS Kyverno policy rejects a container that does not set these
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: keycloak-proxy
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
  extraVolumes:
    - name: keycloak-proxy
      configMap:
        name: t11-blueapi-keycloak-proxy
  proxyVarsAsSecrets: false
  # the chart sets no resources, so the namespace LimitRange default (1 CPU at
  # DLS) would apply and count against the namespace CPU quota
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  extraEnv:
    - name: OAUTH2_PROXY_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: blueapi-secret
          key: client-secret
    - name: OAUTH2_PROXY_COOKIE_SECRET
      valueFrom:
        secretKeyRef:
          name: blueapi-secret
          key: cookie-secret
  config:
    configFile: |-
      skip_provider_button = true
      skip_jwt_bearer_tokens = true
      cookie_refresh="1m"
      cookie_expire="30m"
      cookie_secure = false
      email_domains = [ "*" ]
      skip_auth_routes=[
      "GET=^/config/oidc",
      "GET=^/healthz",
      "^/realms/",
      "^/resources/"
      ]
      whitelist_domains=["t11-keycloak:8080"]
  ingress:
    enabled: false
  alphaConfig:
    enabled: true
    configData:
      upstreamConfig:
        proxyRawPath: true
        upstreams:
          - id: t11-blueapi
            path: /
            uri: http://t11-blueapi
          # keycloak's browser endpoints, for the login pages, through the
          # keycloak-proxy sidecar
          - id: t11-keycloak-realms
            path: /realms/
            uri: http://localhost:8081
          - id: t11-keycloak-resources
            path: /resources/
            uri: http://localhost:8081
      providers:
        - provider: oidc
          id: t11-keycloak
          clientID: t11-blueapi
          clientSecret: ${OAUTH2_PROXY_CLIENT_SECRET}
          # discovery would replace these with keycloak's in-cluster URLs,
          # which a browser cannot reach
          loginURL: /realms/master/protocol/openid-connect/auth
          redeemURL: http://t11-keycloak:8080/realms/master/protocol/openid-connect/token
          profileURL: http://t11-keycloak:8080/realms/master/protocol/openid-connect/userinfo
          oidcConfig:
            skipDiscovery: true
            jwksURL: http://t11-keycloak:8080/realms/master/protocol/openid-connect/certs
            insecureAllowUnverifiedEmail: true
            insecureSkipNonce: true
            emailClaim: sub
            audienceClaims: ["aud"]
            extraAudiences: ["account"]
            issuerURL: http://t11-keycloak:8080/realms/master
      injectRequestHeaders:
        - name: Authorization
          values:
            - claimSource:
                claim: access_token
                prefix: "Bearer "

# Dev secret values, matching the keycloak bootstrap in t11-keycloak.
secrets:
  clientSecret: blueapi-secret
  tiledWriterSecret: secret
  # oauth2-proxy requires exactly 16, 24 or 32 bytes
  cookieSecret: Dhf3pGspLQ5DjtzIz_la8mq2MkCsXzeV
