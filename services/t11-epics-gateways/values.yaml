epics-gateways:
  # developer image for debugging no longer needed - defaults to helm chart version
  # image: ghcr.io/epics-containers/epics-gateways-developer:2026.3.18

  # use ixxdetector account for your beamline
  securityContext:
    # k8s-t11-beamline
    runAsUser: 36261
    runAsGroup: 36261

  hostNetwork: false

  # restart the gateways whenever an IOC in the namespace becomes Ready after
  # they started, so they find IOCs that started later or were restarted
  restartOnNewIocs: true

  # the epics-gateways image is built for amd64 only
  nodeSelector:
    kubernetes.io/arch: amd64

  # applies to both the ca and pva gateway containers. The chart default of
  # 800m each is far above what the t11 IOCs need and counts against the
  # namespace CPU quota
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
