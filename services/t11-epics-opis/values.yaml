# values for the upstream epics-opis chart, namespaced under its dependency
# name (see Chart.yaml)
epics-opis:
  # nginx serving static OPI files is nearly idle. The upstream chart's
  # default resources (200m/600m limits) are far above what's needed and
  # count against a personal namespace's CPU quota
  resources:
    requests:
      memory: 16Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 100m

  service:
    # LoadBalancer, ClusterIP or NodePort. scripts/connect.sh in
    # t11-deployment forwards this Service to localhost; ClusterIP keeps
    # one floating IP per test beamline (see t11-services#29).
    type: ClusterIP
