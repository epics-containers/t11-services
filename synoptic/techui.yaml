beamline:
  short_dom: "T11"
  long_dom: "BL11T"
  desc: t11 simulation beamline
  # placeholder: the tech-ui pre-commit hook rewrites https://xxx-opis/ in
  # the generated screens to ../, so they carry no host name
  url: xxx-opis

# Components for techui-builder. Each key matches a symbol widget name in
# index.bob. `techui-builder build` (the tech-ui pre-commit hook) generates a
# <component>.bob screen from the matching entities in services/*/config/
# ioc.yaml and links the symbol to it, as in i19-services.
#
# techui-support has no screens for motorSim or the plain test IOC, so those
# components use `file` to open the IOC's own screen from the OPI server
# (/<ioc-name>/index.bob, relative to /bl11t-synoptic/).
#
# `status` feeds a <prefix>:STA calc record served by the bl11t-synoptic IOC
# (techui-builder status -> /epics/opi/status.db): 0 when every input is
# NO_ALARM, 1 otherwise, INVALID when an IOC is unreachable.
components:
  DCAM1:
    label: Simulated detector
    prefix: BL11T-DI-CAM-01
    status:
      - BL11T-DI-CAM-01:DRV:DetectorState_RBV.SEVR NPP MS

  MOTORSIM1:
    label: Simulated motors
    prefix: BL11T-MO-SIM-01
    file: $(IOC)/index.bob
    macros:
      P: BL11T-MO-SIMC-01
      IOC: ../bl11t-mo-sim-01
    status:
      - BL11T-MO-SIMC-01:M1.SEVR NPP MS
      - BL11T-MO-SIMC-01:M2.SEVR NPP MS

  EATEST1:
    label: Test IOC
    prefix: BL11T-EA-TEST-01
    file: $(IOC)/index.bob
    macros:
      P: BL11T-EA-TEST-01
      IOC: ../bl11t-ea-test-01
    status:
      - BL11T-EA-TEST-01:IOC_CPU_LOAD.SEVR NPP MS
